<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note To Me</title>
  </head>
  <body>
    <script>
      try{var t=JSON.parse(localStorage.getItem('note-to-me-theme'));if(t&&t.mode==='dark')document.documentElement.classList.add('dark');if(t&&t.colorScheme)document.documentElement.setAttribute('data-color-scheme',t.colorScheme)}catch(e){}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
